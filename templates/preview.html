
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DataMind | Dataset Preview</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #090e1b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #8b9cff;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .card {
            background: #151e32;
            padding: 22px;
            border-radius: 12px;
        }

        .card h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .table-container {
            overflow-x: auto;
            background: #151e32;
            padding: 20px;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #303b52;
        }

        th {
            color: #8b9cff;
            background: #202b42;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: #8b9cff;
            text-decoration: none;
        }

        @media (max-width: 650px) {
            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Dataset Preview</h1>

        <p>Successfully loaded: {{ dataset_name }}</p>

        <div class="summary">

            <div class="card">
                <p>Total Rows</p>
                <h2>{{ total_rows }}</h2>
            </div>

            <div class="card">
                <p>Total Columns</p>
                <h2>{{ total_columns }}</h2>
            </div>

            <div class="card">
                <p>Preview Records</p>
                <h2>5</h2>
            </div>

        </div>

        <div class="card">
            <h3>Column Names</h3>

            <p>
                {% for column in column_names %}
                    {{ column }} |
                {% endfor %}
            </p>
        </div>

        <br>

        <div class="table-container">

            <h3>First 5 Records</h3>

            {{ preview_data | safe }}

        </div>

        <a href="/">← Back to Dashboard</a>

    </div>

</body>
</html>
